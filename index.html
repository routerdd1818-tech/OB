<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project ATLAS：跨文化職場對話博弈（學員手機端）</title>
  <style>
    :root {
      --bg-canvas: #090a0f;
      --bg-surface: #10121a;
      --bg-card: #151822;
      --bg-card-hover: #1b1f2c;
      --bg-elevated: #1f2432;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-focus: #3b82f6;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #3b82f6;
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-danger: #f43f5e;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      -webkit-font-smoothing: antialiased;
    }

    #app-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
      padding-bottom: 85px;
    }

    /* Mobile Header */
    header.mobile-header {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(16, 18, 26, 0.96);
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: blur(16px);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mobile-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #151822;
      border: 1px solid var(--border-subtle);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .user-profile-badge:hover { border-color: var(--border-medium); }
    .user-name-text { font-weight: 600; color: #f8fafc; }
    .user-team-text { font-weight: 500; color: #60a5fa; font-family: var(--font-mono); }
    .header-round-indicator { font-size: 11px; font-weight: 500; color: var(--text-muted); }

    /* Team Health Card */
    .mobile-team-hp-card {
      background: #0d0f15;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .mobile-team-hp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 600;
    }
    .mobile-team-title { color: var(--text-secondary); }
    .mobile-team-hp-num { color: var(--color-success); font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
    .mobile-team-hp-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .mobile-team-hp-fill {
      height: 100%;
      width: 100%;
      background: var(--color-success);
      transition: width 0.6s ease, background 0.3s ease;
    }

    /* Mobile Arena */
    main.mobile-arena {
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }
    .scenario-brief-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .scenario-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 600;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(59, 130, 246, 0.25);
      width: fit-content;
    }
    .scenario-title { font-size: 15px; font-weight: 700; color: #f8fafc; letter-spacing: -0.01em; }
    .scenario-dialogue {
      background: #0d0f15;
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--accent-blue);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12.5px;
      line-height: 1.6;
      color: #f1f5f9;
    }

    /* Options List */
    .mobile-options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mobile-option-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mobile-option-card:active { transform: scale(0.99); }
    .mobile-option-card.selected {
      border-color: #3b82f6;
      background: #141b29;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
    }
    .mobile-option-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #f8fafc;
    }
    .mobile-option-text {
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-secondary);
    }
    .mobile-option-rationale {
      font-size: 11px;
      color: var(--text-muted);
      background: #0d0f15;
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }
    .mobile-reveal-box {
      margin-top: 4px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      line-height: 1.5;
      display: none;
    }
    .mobile-reveal-box.reveal-penalty { background: rgba(244, 63, 94, 0.08); border: 1px solid rgba(244, 63, 94, 0.25); color: #fda4af; }
    .mobile-reveal-box.reveal-success { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); color: #6ee7b7; }

    /* Sticky Bottom Submit Bar */
    .mobile-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 100;
      background: rgba(16, 18, 26, 0.96);
      border-top: 1px solid var(--border-subtle);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
    }
    .mobile-bottom-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 60%;
    }
    .mobile-selection-label { font-size: 10px; color: var(--text-muted); }
    .mobile-selection-val { font-size: 12px; font-weight: 600; color: #f8fafc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mobile-submit-btn {
      background: var(--accent-blue);
      color: #ffffff;
      border: 1px solid var(--accent-blue);
      font-size: 12.5px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .mobile-submit-btn:disabled {
      background: #181b25;
      border-color: var(--border-subtle);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    /* Onboarding Modal */
    .onboarding-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      backdrop-filter: blur(12px);
    }
    .onboarding-card {
      background: #12151e;
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      max-width: 380px;
      width: 100%;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }
    .onboarding-title { font-size: 16px; font-weight: 700; color: #f8fafc; text-align: center; }
    .onboarding-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; text-align: center; }
    .onboarding-form { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); }
    .form-input {
      background: #0d0f15;
      border: 1px solid var(--border-subtle);
      color: #f8fafc;
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus { border-color: var(--border-focus); }

    /* Team Selector Pills (No team size quotas!) */
    .team-pills-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .team-pill-btn {
      background: #181b25;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 600;
      padding: 8px 4px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .team-pill-btn:hover { background: #202534; color: #f8fafc; }
    .team-pill-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .onboarding-btn {
      background: var(--accent-blue);
      color: #ffffff;
      border: 1px solid var(--accent-blue);
      font-size: 13.5px;
      font-weight: 600;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .onboarding-btn:hover { background: #2563eb; }
  </style>
</head>
<body>

<div id="app-container">
  <header class="mobile-header">
    <div class="mobile-header-top">
      <div class="user-profile-badge" onclick="reopenOnboarding()">
        <span class="user-name-text" id="hud-user-name">學員</span>
        <span>|</span>
        <span class="user-team-text" id="hud-user-team">第 1 組</span>
      </div>
      <span style="font-size: 10px; color: #a39789;" id="round-status-indicator">【等待大螢幕指示】</span>
    </div>

    <div class="mobile-team-hp-card">
      <div class="mobile-team-hp-header">
        <span class="mobile-team-title" id="team-hp-title">本組 CQ 生命值</span>
        <span class="mobile-team-hp-num" id="team-hp-num">100 CQ</span>
      </div>
      <div class="mobile-team-hp-track">
        <div class="mobile-team-hp-fill" id="team-hp-fill"></div>
      </div>
    </div>
  </header>

  <main class="mobile-arena">
    <div class="scenario-brief-card">
      <div class="scenario-badge" id="mobile-theme-tag">【認知維度】</div>
      <h2 class="scenario-title" id="mobile-scenario-title">委婉留白時的追問藝術</h2>
      <div class="scenario-dialogue" id="mobile-dialogue-text">載入中...</div>
    </div>

    <div class="mobile-options-container" id="mobile-options-list"></div>

    <div class="footer-host-link" onclick="window.location.href='/host'">
      [ 簡報者切換至電腦主控台 ]
    </div>
  </main>

  <div class="mobile-bottom-bar">
    <div class="mobile-bottom-info">
      <span class="mobile-selection-label">本組研議之代表決策：</span>
      <span class="mobile-selection-val" id="bottom-selected-text">尚未選取選項</span>
    </div>
    <button class="mobile-submit-btn" id="btn-bottom-submit" onclick="submitDecision()" disabled>
      送出本組決策
    </button>
  </div>
</div>

<!-- Onboarding Modal (Requires Name + Team, NO expected team size displayed!) -->
<div class="onboarding-overlay" id="onboarding-modal" style="display: none;">
  <div class="onboarding-card">
    <h3 class="onboarding-title">PROJECT ATLAS</h3>
    <p class="onboarding-desc">請輸入您的姓名並點選所屬組別以加入決策會議：</p>
    <div class="onboarding-form">
      <div class="form-group">
        <label class="form-label">您的姓名：</label>
        <input type="text" class="form-input" id="input-name" placeholder="請輸入姓名（例如：王專員）" />
      </div>
      <div class="form-group">
        <label class="form-label">所屬組別：</label>
        <div class="team-pills-grid" id="team-selector-pills">
          <button type="button" class="team-pill-btn active" id="pill-team-1" onclick="selectTeamPill(1)">第 1 組</button>
          <button type="button" class="team-pill-btn" id="pill-team-2" onclick="selectTeamPill(2)">第 2 組</button>
          <button type="button" class="team-pill-btn" id="pill-team-3" onclick="selectTeamPill(3)">第 3 組</button>
          <button type="button" class="team-pill-btn" id="pill-team-4" onclick="selectTeamPill(4)">第 4 組</button>
          <button type="button" class="team-pill-btn" id="pill-team-5" onclick="selectTeamPill(5)">第 5 組</button>
        </div>
        <input type="hidden" id="input-team" value="1" />
      </div>
      <button class="onboarding-btn" onclick="confirmOnboarding()">進入會議</button>
    </div>
  </div>
</div>

<script>

  const AudioEngine = {
    ctx: null,
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    },
    playClick() {
      try {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      } catch (e) {}
    },
    playDamage() {
      try {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
      } catch (e) {}
    },
    playChime() {
      try {
        this.init();
        if (!this.ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.3);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.3);
        });
      } catch (e) {}
    }
  };


  const DilemmasData = {
    1: {
      themeTag: "【主題一：認知維度】高語境解碼與深層常模辨識",
      title: "【實戰第一回】委婉留白時的追問藝術",
      sceneKey: "midnightBoardroom",
      speaker: "佐藤部長（雙手交疊，緩緩喝了一口茶，審慎沉吟）：",
      dialogue: "「……交付時程方面，我們現場會全力以赴進行慎重研討，只是部分細節可能還需要團隊內部進一步調研……」\n\n【背景形勢】：總部明日開盤前必須向華爾街做空機構與董事會提交進度，此時總部該如何接話？",
      options: [
        {
          id: "A",
          title: "方案 A：進度量化追蹤策略",
          text: "「感謝佐藤部長的回饋。為確保全球供應鏈排程精準，請東京團隊在今日下午 5 點前，將調研里程碑量化為具體甘特圖並標註預計完工日。」",
          rationale: "表面合理性：標準專案管理（PMP）SMART 原則，界定清晰交付物與期限，對董事會與投資人忠實負責。",
          penalty: -20,
          blindspot: "文化盲點：日方高語境下「慎重研討」已是幾近無法如期完工的求救訊號。公開逼問硬性死線等於逼其當場認錯或撒謊，破壞深層信任。"
        },
        {
          id: "B",
          title: "方案 B：全球資源緊急調度策略",
          text: "「總部充分理解東京團隊的沉重壓力。我們已批准協調 5 位矽谷資深架構師於明晨直飛東京現場，直接進駐協助分擔程式碼調校。」",
          rationale: "表面合理性：高管資源傾斜、頂尖專家技術賦能、主動替海外第一線同仁分擔極限工作量。",
          penalty: -25,
          blindspot: "文化盲點：在日式職人與現場主義（Gemba）文化中，不請自來的總部專家等同官方審計接管，暗示東京團隊無能，激起全員防衛消極抵制。"
        },
        {
          id: "C",
          title: "方案 C：全員民主共識決策機制",
          text: "「為分擔管理層決策壓力，建議此時在大會中由美日全體研發工程師進行線上不記名投票，依第一線真實工時表決是否微調發布日。」",
          rationale: "表面合理性：扁平化治理、心理安全感、打破科層官僚壁壘、汲取第一線集體智慧。",
          penalty: -15,
          blindspot: "文化盲點：破壞東亞長幼有序與組織和睦（和，Wa）。強迫基層在主管前公開表態會造成極大社交焦慮，且被日方視為總部推卸治理責任。"
        },
        {
          id: "D",
          title: "方案 D：雙邊技術排程微調對齊",
          text: "「非常理解公差調研的嚴謹性與技術深度。今日大會先行休會，會後由我方營運負責人親自致電佐藤部長，就底層架構參數先做個別溝通。」",
          rationale: "管理實效：不在公開大會讓對方下不了台，移至非公開場域建立心理安全通道，探求水面下的真正技術瓶頸。",
          penalty: 0,
          bonus: 5,
          blindspot: "最優解：精準實踐「根回し（Nemawashi）」，為日方搭設心理安全階梯，真正被挪用晶圓的實情方能在私下電話中被如實吐露。"
        }
      ]
    },

    2: {
      themeTag: "【主題二：動機維度】自尊維護與消解文化防衛",
      title: "【實戰第二回】晶圓遭挪用風暴與責任定調",
      sceneKey: "confidentialLab",
      speaker: "東京工程團隊（遞交底層 log 數據與集體抗議連署書）：",
      dialogue: "東京私下向調解人證實：延誤根本非技術問題（東京良率實測達 98.4%），而是總部董事關係戶私自插單強行挪走 30% 晶圓！東京團隊連續加班三週背黑鍋，如今卻被總部公開質疑工作效率低落，日本工程師全員抗議。\n\n【背景形勢】：調解席與總部該如何定調這起內部醜聞，並平息兩地怒火？",
      options: [
        {

  function initMobileApp() {
    try {
      MobileState.syncChannel = new BroadcastChannel('project_atlas_cq_sync');
      MobileState.syncChannel.onmessage = (e) => {
        handleHostSync(e.data);
      };
    } catch (err) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'project_atlas_cq_state' && e.newValue) {
        try { handleHostSync(JSON.parse(e.newValue)); } catch (err) {}
      }
    });

    // Check saved user
    const saved = localStorage.getItem('atlas_mobile_user');
    if (saved) {
      try {
        MobileState.user = JSON.parse(saved);
        updateUserUI();
      } catch (e) {
        showOnboarding();
      }
    } else {
      showOnboarding();
    }

    renderCurrentRound();
  }

  function showOnboarding() {
    const modal = document.getElementById('onboarding-modal');
    if (modal) modal.style.display = 'flex';
    selectTeamPill(MobileState.user.team || 1);
  }

  function selectTeamPill(teamId) {
    AudioEngine.playClick();
    document.getElementById('input-team').value = teamId;
    for (let i = 1; i <= 5; i++) {
      const p = document.getElementById(`pill-team-${i}`);
      if (p) {
        if (i === teamId) p.classList.add('active');
        else p.classList.remove('active');
      }
    }
  }

  function reopenOnboarding() {
    AudioEngine.playClick();
    document.getElementById('input-name').value = MobileState.user.name || '';
    const teamId = MobileState.user.team || 1;
    document.getElementById('input-team').value = teamId;
    selectTeamPill(teamId);
    showOnboarding();
  }

  function confirmOnboarding() {
    AudioEngine.playClick();
    const name = document.getElementById('input-name').value.trim();
    const team = parseInt(document.getElementById('input-team').value, 10);
    if (!name) {
      alert('請先輸入您的姓名！');
      return;
    }
    MobileState.user = { name, team };
    localStorage.setItem('atlas_mobile_user', JSON.stringify(MobileState.user));
    document.getElementById('onboarding-modal').style.display = 'none';
    updateUserUI();

    // Broadcast join event
    broadcastToHost('TEAM_JOIN', { teamId: team, userName: name });
    renderCurrentRound();
  }

  function updateUserUI() {
    document.getElementById('hud-user-name').innerText = MobileState.user.name || '學員';
    document.getElementById('hud-user-team').innerText = `第 ${MobileState.user.team} 組`;
    updateTeamHPUI();
  }

  function updateTeamHPUI() {
    const team = MobileState.teams[MobileState.user.team];
    if (!team) return;
    document.getElementById('team-hp-title').innerText = `${team.name.split('（')[0]} 生命值`;
    document.getElementById('team-hp-num').innerText = `${team.hp} CQ`;
    const fill = document.getElementById('team-hp-fill');
    if (fill) fill.style.width = `${Math.max(0, Math.min(100, team.hp))}%`;
  }

  function handleHostSync(msg) {
    if (!msg || !msg.type) return;
    if (msg.type === 'STATE_UPDATE') {
      if (msg.teams) MobileState.teams = msg.teams;
      if (msg.currentRound) MobileState.currentRound = msg.currentRound;
      if (msg.roundStatus) MobileState.roundStatus = msg.roundStatus;
      updateTeamHPUI();
      renderCurrentRound();
      if (MobileState.roundStatus === 'revealed') {
        applyMobileRevealedUI();
      }
    } else if (msg.type === 'TEAM_SUBMIT') {
      const { teamId, choiceId } = msg;
      if (MobileState.teams[teamId]) {
        MobileState.teams[teamId].currentChoice = choiceId;
        MobileState.teams[teamId].submitted = true;
        if (teamId === MobileState.user.team) {
          updateSubmissionUI();
        }
      }
    }
  }

  function broadcastToHost(type, payload = {}) {
    const packet = { type, ...payload, timestamp: Date.now() };
    if (MobileState.syncChannel) {
      try { MobileState.syncChannel.postMessage(packet); } catch (e) {}
    }
    try { localStorage.setItem('project_atlas_cq_state', JSON.stringify(packet)); } catch (e) {}
  }

  function renderCurrentRound() {
    const roundNum = MobileState.currentRound;
    const data = DilemmasData[roundNum];
    if (!data) return;

    let factionData = null;
    if (data.isAsymmetric) {
      const userFaction = MobileState.teams[MobileState.user.team].faction;
      factionData = data.factions[userFaction];
    }

    document.getElementById('mobile-theme-tag').innerText = data.themeTag + (factionData ? ` - ${factionData.factionName}` : '');
    document.getElementById('mobile-scenario-title').innerText = data.title;
    document.getElementById('mobile-dialogue-text').innerText = factionData ? factionData.dialogue : data.dialogue;

    renderOptions(factionData ? factionData.options : data.options);
    updateSubmissionUI();
    updateTeamHPUI();
  }

  function renderOptions(options) {
    const list = document.getElementById('mobile-options-list');
    if (!list) return;
    let html = '';
    const myTeam = MobileState.teams[MobileState.user.team];

    options.forEach(opt => {
      const isSelected = (myTeam.currentChoice === opt.id);
      html += `
        <div class="mobile-option-card ${isSelected ? 'selected' : ''}" id="m-opt-${opt.id}" onclick="selectMobileOption('${opt.id}')">
          <div class="mobile-option-title">${opt.title}</div>
          <div class="mobile-option-text">${opt.text}</div>
          <div class="mobile-option-rationale">${opt.rationale}</div>
          <div class="mobile-reveal-box ${opt.penalty < 0 ? 'reveal-penalty' : 'reveal-success'}" id="m-reveal-${opt.id}">
            <strong>【CQ 判定結果】：${opt.penalty < 0 ? `${opt.penalty} 點 CQ` : `+${opt.bonus} 點 CQ (卓越決策)`}</strong><br>
            <span>${opt.blindspot}</span>
          </div>
        </div>
      `;
    });
    list.innerHTML = html;
  }

  function selectMobileOption(choiceId) {
    AudioEngine.playClick();
    if (MobileState.roundStatus === 'revealed') return;
    const myTeam = MobileState.teams[MobileState.user.team];
    if (myTeam.submitted) return;

    myTeam.currentChoice = choiceId;
    document.querySelectorAll('.mobile-option-card').forEach(c => c.classList.remove('selected'));
    const target = document.getElementById(`m-opt-${choiceId}`);
    if (target) target.classList.add('selected');

    updateSubmissionUI();
  }

  function updateSubmissionUI() {
    const myTeam = MobileState.teams[MobileState.user.team];
    const textLabel = document.getElementById('bottom-selected-text');
    const submitBtn = document.getElementById('btn-bottom-submit');
    const statusIndicator = document.getElementById('round-status-indicator');

    if (myTeam.submitted) {
      textLabel.innerText = `本組已送出：選項 ${myTeam.currentChoice}`;
      submitBtn.innerText = '已送出決策';
      submitBtn.disabled = true;
      statusIndicator.innerText = '已送出，等待主控台揭曉';
    } else if (myTeam.currentChoice) {
      textLabel.innerText = `已選取：選項 ${myTeam.currentChoice}`;
      submitBtn.innerText = '送出本組決策';
      submitBtn.disabled = false;
      statusIndicator.innerText = '請確認並送出';
    } else {
      textLabel.innerText = '尚未選取選項';
      submitBtn.innerText = '送出本組決策';
      submitBtn.disabled = true;
      statusIndicator.innerText = '決策研討中';
    }
  }

  function submitDecision() {
    AudioEngine.playChime();
    const myTeam = MobileState.teams[MobileState.user.team];
    if (!myTeam.currentChoice) return;
    myTeam.submitted = true;
    updateSubmissionUI();

    broadcastToHost('TEAM_SUBMIT', {
      teamId: MobileState.user.team,
      choiceId: myTeam.currentChoice
    });
  }

  function applyMobileRevealedUI() {
    const currentData = DilemmasData[MobileState.currentRound];
    if (!currentData) return;
    let opts = currentData.options;
    if (currentData.isAsymmetric) {
      const userFaction = MobileState.teams[MobileState.user.team].faction;
      opts = currentData.factions[userFaction].options;
    }
    if (opts) {
      opts.forEach(opt => {
        const box = document.getElementById(`m-reveal-${opt.id}`);
        if (box) box.style.display = 'block';
      });
    }
    document.getElementById('round-status-indicator').innerText = 'CQ 判定已揭曉';
  }

  window.addEventListener('DOMContentLoaded', () => {
    initMobileApp();
  });
</script>

</body>
</html>
