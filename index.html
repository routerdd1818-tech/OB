<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OB報告：跨文化職場對話博弈（學員手機端）</title>
  <style>
    :root {
      /* Warm Beige Apple Minimalist Palette */
      --ios-bg: #f7f4ed;              /* Primary canvas: Warm soothing linen beige */
      --ios-surface: #ede8dc;         /* Secondary surface: Soft oat beige */
      --ios-card: #ffffff;            /* Card background: Pure warm crisp white */
      --ios-card-hover: #faf8f3;      /* Card hover: Soft ivory */
      --ios-elevated: #fcfbfa;        /* Floating card: Off-white */
      --ios-hairline: rgba(60, 50, 40, 0.1); /* Subtle warm hairline */
      --ios-hairline-strong: rgba(60, 50, 40, 0.18);
      --ios-shadow: 0 4px 18px rgba(70, 55, 40, 0.06);

      --ios-label: #1c1917;           /* Primary text: Deep warm charcoal */
      --ios-secondary-label: #57534e; /* Secondary text: Warm slate */
      --ios-tertiary-label: #8c827a;  /* Tertiary text: Muted warm gray */

      /* Refined Accents on Beige */
      --ios-blue: #0071e3;            /* Apple System Blue */
      --ios-green: #15803d;           /* Forest Green */
      --ios-amber: #b45309;           /* Warm Amber / Ochre */
      --ios-red: #dc2626;             /* Crimson Red */
      --ios-indigo: #4f46e5;          /* Deep Indigo */
      --ios-purple: #7c3aed;          /* Royal Violet */

      --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang TC", "Helvetica Neue", sans-serif;
      --ios-mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
      --ios-radius-card: 18px;
      --ios-radius-pill: 9999px;
      --ios-radius-btn: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--ios-bg);
      color: var(--ios-label);
      font-family: var(--ios-font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 96px; /* space for sticky bar */
    }

    /* Apple Floating Toast */
    #ios-toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      background: rgba(28, 25, 23, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--ios-radius-pill);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 9999;
      pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      opacity: 0;
      max-width: 90vw;
      text-align: center;
    }
    #ios-toast.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Container */
    #mobile-app {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header Bar */
    .mobile-header {
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline);
      border-radius: var(--ios-radius-card);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--ios-shadow);
    }
    .mobile-user-profile {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .user-name-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ios-label);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .user-team-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--ios-radius-pill);
      display: inline-block;
      width: fit-content;
    }
    .team-badge-decision {
      background: rgba(0, 113, 227, 0.1);
      color: var(--ios-blue);
      border: 1px solid rgba(0, 113, 227, 0.25);
    }
    .team-badge-jury {
      background: rgba(124, 58, 237, 0.12);
      color: var(--ios-purple);
      border: 1px solid rgba(124, 58, 237, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sync-status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-surface);
      font-size: 11.5px;
      color: var(--ios-secondary-label);
      font-weight: 600;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #15803d;
      box-shadow: 0 0 6px rgba(21, 128, 61, 0.6);
    }
    .room-tag-btn {
      background: var(--ios-surface);
      border: 1px solid var(--ios-hairline);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      color: var(--ios-secondary-label);
      cursor: pointer;
    }

    /* Round Tracker Banner */
    .round-hero-banner {
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline);
      border-radius: var(--ios-radius-card);
      padding: 14px 16px;
      box-shadow: var(--ios-shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .round-tag-pill {
      font-size: 11px;
      font-weight: 700;
      color: var(--ios-amber);
      background: rgba(180, 83, 9, 0.1);
      padding: 3px 10px;
      border-radius: var(--ios-radius-pill);
      width: fit-content;
      letter-spacing: 0.3px;
    }
    .round-scenario-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ios-label);
      line-height: 1.35;
    }
    .round-status-pill {
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      width: fit-content;
    }
    .status-pill-voting { background: rgba(0, 113, 227, 0.1); color: var(--ios-blue); }
    .status-pill-revealed { background: rgba(21, 128, 61, 0.12); color: var(--ios-green); }

    /* Team HP Micro Strip */
    .team-hp-strip {
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline);
      border-radius: 12px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      box-shadow: var(--ios-shadow);
    }
    .team-hp-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .team-hp-label { font-size: 10px; color: var(--ios-secondary-label); font-weight: 600; }
    .team-hp-bar {
      width: 100%;
      height: 5px;
      background: var(--ios-surface);
      border-radius: var(--ios-radius-pill);
      overflow: hidden;
    }
    .team-hp-fill {
      height: 100%;
      background: var(--ios-green);
      transition: width 0.5s ease;
    }
    .team-hp-val { font-size: 10.5px; font-weight: 700; font-family: var(--ios-mono); color: var(--ios-label); }

    /* Scenario Context & Dialogue Card */
    .scenario-dialogue-card {
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline);
      border-radius: var(--ios-radius-card);
      padding: 14px 16px;
      box-shadow: var(--ios-shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .speaker-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ios-secondary-label);
    }
    .dialogue-content {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--ios-label);
      background: var(--ios-bg);
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--ios-hairline);
      white-space: pre-line;
    }

    /* Decision Mode: Options List */
    .options-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ios-secondary-label);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .section-tip {
      font-size: 11.5px;
      color: var(--ios-tertiary-label);
    }

    .option-card {
      background: var(--ios-card);
      border: 1.5px solid var(--ios-hairline);
      border-radius: var(--ios-radius-card);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--ios-shadow);
      position: relative;
    }
    .option-card:active {
      transform: scale(0.98);
    }
    .option-card.selected {
      border-color: var(--ios-blue);
      background: rgba(0, 113, 227, 0.04);
      box-shadow: 0 4px 20px rgba(0, 113, 227, 0.12);
    }
    .option-card.locked-selected {
      border-color: var(--ios-green);
      background: rgba(21, 128, 61, 0.05);
    }
    .option-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .option-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ios-label);
    }
    .option-dimension-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-surface);
      color: var(--ios-secondary-label);
    }
    .option-text {
      font-size: 13px;
      line-height: 1.55;
      color: #383431;
    }

    /* Group Submission Anonymous Lock Card */
    .group-lock-card {
      background: var(--ios-card);
      border: 1.5px solid rgba(21, 128, 61, 0.35);
      border-radius: var(--ios-radius-card);
      padding: 16px;
      box-shadow: 0 4px 20px rgba(21, 128, 61, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .group-lock-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ios-green);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .group-lock-desc {
      font-size: 13px;
      color: var(--ios-secondary-label);
      line-height: 1.5;
    }
    .persuasion-pitch-box {
      background: rgba(180, 83, 9, 0.08);
      border: 1px dashed rgba(180, 83, 9, 0.35);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
    }
    .pitch-box-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ios-amber);
      margin-bottom: 4px;
    }
    .pitch-box-text {
      font-size: 12px;
      color: #57534e;
      line-height: 1.5;
    }

    /* Jury Mode Components */
    .jury-monitor-card {
      background: var(--ios-card);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: var(--ios-radius-card);
      padding: 16px;
      box-shadow: var(--ios-shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .jury-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .jury-badge-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ios-purple);
    }
    .jury-progress-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .jury-team-chip {
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .chip-done { background: rgba(21, 128, 61, 0.12); color: var(--ios-green); }
    .chip-wait { background: var(--ios-surface); color: var(--ios-tertiary-label); }

    .jury-preview-intel {
      background: rgba(124, 58, 237, 0.06);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--ios-secondary-label);
      line-height: 1.5;
    }

    /* Evaluation Cards for Team 5 */
    .jury-team-eval-card {
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline-strong);
      border-radius: var(--ios-radius-card);
      padding: 14px 16px;
      box-shadow: var(--ios-shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .eval-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .eval-team-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ios-label);
    }
    .eval-choice-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--ios-radius-pill);
      background: rgba(0, 113, 227, 0.1);
      color: var(--ios-blue);
    }
    .eval-option-content {
      font-size: 12.5px;
      color: #44403c;
      line-height: 1.5;
      background: var(--ios-bg);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--ios-hairline);
    }
    .eval-blindspot-box {
      background: rgba(180, 83, 9, 0.08);
      border-left: 3px solid var(--ios-amber);
      padding: 8px 10px;
      border-radius: 0 8px 8px 0;
      font-size: 11.5px;
      color: #78350f;
      line-height: 1.45;
    }
    .ranking-control-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ranking-control-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ios-secondary-label);
    }
    .rank-buttons-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .rank-btn {
      background: var(--ios-surface);
      border: 1px solid var(--ios-hairline);
      border-radius: 10px;
      padding: 10px 0;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ios-secondary-label);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .rank-btn:active { transform: scale(0.96); }
    .rank-btn.active {
      background: var(--ios-purple);
      color: #ffffff;
      border-color: var(--ios-purple);
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.3);
    }

    /* Tier Buttons for Round 3 */
    .tier-buttons-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .tier-btn {
      background: var(--ios-surface);
      border: 1px solid var(--ios-hairline);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ios-secondary-label);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tier-btn:active { transform: scale(0.98); }
    .tier-btn.active {
      background: var(--ios-purple);
      color: #ffffff;
      border-color: var(--ios-purple);
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.3);
    }

    /* Revealed Debrief Card */
    .revealed-debrief-card {
      background: var(--ios-card);
      border: 1.5px solid rgba(21, 128, 61, 0.3);
      border-radius: var(--ios-radius-card);
      padding: 16px;
      box-shadow: var(--ios-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .debrief-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .debrief-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ios-green);
    }
    .debrief-rank-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--ios-radius-pill);
      background: rgba(21, 128, 61, 0.12);
      color: var(--ios-green);
    }
    .tension-metrics-box {
      background: var(--ios-bg);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid var(--ios-hairline);
    }
    .tension-metrics-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--ios-secondary-label);
    }
    .tension-track {
      width: 100%;
      height: 6px;
      background: rgba(60, 50, 40, 0.08);
      border-radius: var(--ios-radius-pill);
      overflow: hidden;
    }
    .tension-fill {
      height: 100%;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-green);
      transition: width 0.8s ease;
    }
    .revealed-blindspot-box {
      background: rgba(180, 83, 9, 0.08);
      border-radius: 12px;
      padding: 12px;
      border-left: 3px solid var(--ios-amber);
      font-size: 12.5px;
      color: #78350f;
      line-height: 1.55;
    }

    /* Sticky Bottom Bar */
    .mobile-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--ios-hairline-strong);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
      z-index: 900;
    }
    .bottom-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 55%;
    }
    .bottom-info-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ios-label);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bottom-info-sub {
      font-size: 11px;
      color: var(--ios-tertiary-label);
    }
    .btn-submit-action {
      flex: 1;
      padding: 12px 16px;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-blue);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.25);
    }
    .btn-submit-action:active { transform: scale(0.97); }
    .btn-submit-action:disabled {
      background: var(--ios-surface);
      color: var(--ios-tertiary-label);
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-jury-action {
      background: var(--ios-purple);
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.25);
    }

    /* Onboarding Modal */
    .onboarding-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(28, 25, 23, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .onboarding-card {
      background: var(--ios-card);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .onboarding-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--ios-label);
      text-align: center;
    }
    .onboarding-subtitle {
      font-size: 13px;
      color: var(--ios-secondary-label);
      text-align: center;
      line-height: 1.5;
    }
    .onboarding-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ios-secondary-label);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-text {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--ios-radius-btn);
      border: 1px solid var(--ios-hairline-strong);
      background: var(--ios-bg);
      font-size: 14px;
      color: var(--ios-label);
      outline: none;
      font-family: inherit;
    }
    .input-text:focus { border-color: var(--ios-blue); }

    .team-pills-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .team-pill-opt {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--ios-hairline);
      background: var(--ios-bg);
      font-size: 13px;
      font-weight: 600;
      color: var(--ios-label);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }
    .team-pill-opt.selected {
      border-color: var(--ios-blue);
      background: rgba(0, 113, 227, 0.08);
      color: var(--ios-blue);
    }
    .team-pill-opt.jury-opt.selected {
      border-color: var(--ios-purple);
      background: rgba(124, 58, 237, 0.1);
      color: var(--ios-purple);
    }
    .btn-join-confirm {
      padding: 14px;
      border-radius: var(--ios-radius-pill);
      background: var(--ios-label);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- Floating Toast -->
  <div id="ios-toast"></div>

  <!-- Onboarding Modal -->
  <div id="onboarding-modal" class="onboarding-overlay">
    <div class="onboarding-card">
      <div class="onboarding-title">加入跨文化博弈對決</div>

      }

    playClick() {
      try {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      } catch (e) {}
    },
    playChime() {
      try {
        this.init();
        if (!this.ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.07);

          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.07 + 0.28);
          osc.start(this.ctx.currentTime + idx * 0.07);
          osc.stop(this.ctx.currentTime + idx * 0.07 + 0.28);
        });
      } catch (e) {}
    }

      const stateTopic = `ob_cq_state_${this.roomId}`;
      try {
        this.sseSource = new EventSource(`https://ntfy.sh/${stateTopic}/sse`);
        this.sseSource.onopen = () => this.updateStatusUI(true);
        this.sseSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.event === 'message') {
              const msgId = data.id;
              if (msgId && this.processedMsgIds.has(msgId)) return;
              if (msgId) this.processedMsgIds.add(msgId);
              const payload = JSON.parse(data.message);
              this.handleIncoming(payload);
            }
          } catch (err) {}
        };
        this.sseSource.onerror = () => this.updateStatusUI(false);
      } catch (err) {
        this.updateStatusUI(false);
      }

      // 4. Polling backup every 2.5s
      if (this.pollTimer) clearInterval(this.pollTimer);
      this.pollTimer = setInterval(() => this.pollState(10), 2500);
      this.pollState(60);
    },

    handleIncoming(payload) {
      if (!payload || !payload.type) return;
      const key = payload.msgId || `${payload.type}_${payload.currentRound}_${payload.roundStatus}_${payload.timestamp}`;
      if (this.processedMsgIds.has(key)) return;
      this.processedMsgIds.add(key);

      handleHostStateMessage(payload);
    },

    send(packet) {
      packet.msgId = packet.msgId || ('mobile_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6));
      packet.timestamp = packet.timestamp || Date.now();
      packet.roomId = this.roomId;
      this.processedMsgIds.add(packet.msgId);

      // Local broadcast
      if (this.syncChannel) {
        try { this.syncChannel.postMessage(packet); } catch (e) {}
      }
      try {
        localStorage.setItem('ob_cq_vote_' + this.roomId, JSON.stringify(packet));
      } catch (e) {}

      // Remote POST to host
      const voteTopic = `ob_cq_vote_${this.roomId}`;
      fetch(`https://ntfy.sh/${voteTopic}`, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(packet)
      }).catch(() => {});
    },

    pollState(sinceSec = 10) {
      const stateTopic = `ob_cq_state_${this.roomId}`;
      fetch(`https://ntfy.sh/${stateTopic}/json?poll=1&since=${sinceSec}s`)
        .then(res => res.text())
        .then(text => {
          if (!text) return;
          const lines = text.trim().split('\n');
          lines.forEach(line => {
            if (!line) return;
            try {
              const data = JSON.parse(line);
              if (data.event === 'message') {
                const msgId = data.id;
                if (msgId && this.processedMsgIds.has(msgId)) return;
                if (msgId) this.processedMsgIds.add(msgId);
                const payload = JSON.parse(data.message);
                this.handleIncoming(payload);
              }
            } catch (e) {}
          });
        })
        .catch(() => {});
    }
  };

  /* Host State Processing */
  function handleHostStateMessage(msg) {
    if (!msg || !msg.type) return;

    // Check round or status changes
    let needsRerender = false;

    if (msg.currentRound !== undefined && msg.currentRound !== MobileState.currentRound) {
      MobileState.currentRound = msg.currentRound;
      MobileState.localSelectedChoice = null;
      MobileState.juryRankings = {};
      MobileState.jurySubmitted = false;
      needsRerender = true;
      showToast(`簡報者已切換至第 ${msg.currentRound} 回合！`);
    }

    if (msg.roundStatus && msg.roundStatus !== MobileState.roundStatus) {
      MobileState.roundStatus = msg.roundStatus;
      needsRerender = true;
      if (msg.roundStatus === 'revealed') {
        AudioEngine.playChime();
        showToast('大螢幕已揭曉裁判評定與衝突指數！');
      }
    }

    // Update Team HP & Submissions
    if (msg.teams) {
      for (let i = 1; i <= 5; i++) {
        if (msg.teams[i]) {
          MobileState.teams[i].hp = msg.teams[i].hp;
          MobileState.teams[i].submitted = msg.teams[i].submitted;
        }
      }
      updateTeamHPUI();
    }

    // Confidential team choices (available to Jury or to sync team submitted choice)
    if (msg.teamChoices) {
      for (let i = 1; i <= 4; i++) {
        if (msg.teamChoices[i]) {
          MobileState.teams[i].currentChoice = msg.teamChoices[i];
        }
      }
    }

    if (msg.juryRankings) {
      MobileState.juryRankings = msg.juryRankings;
    }
    if (msg.jurySubmitted !== undefined) {
      MobileState.jurySubmitted = msg.jurySubmitted;
    }
    if (msg.tensionData) {
      MobileState.tensionData = msg.tensionData;
    }

    renderCurrentRound();
  }

  function updateTeamHPUI() {
    for (let i = 1; i <= 5; i++) {
      const bar = document.getElementById(`hp-bar-${i}`);
      const val = document.getElementById(`hp-val-${i}`);
      const hp = (MobileState.teams[i] && MobileState.teams[i].hp !== undefined) ? MobileState.teams[i].hp : 100;
      if (bar) bar.style.width = hp + '%';
      if (val) val.innerText = hp;
    }
  }

      MobileState.user.name = savedName;
      MobileState.user.team = parseInt(savedTeam);
      document.getElementById('onboarding-modal').style.display = 'none';
      updateHUDProfile();
      renderCurrentRound();

      RealtimeSync.send({
        type: 'TEAM_JOIN',
        teamId: MobileState.user.team,
        name: MobileState.user.name
      });
    } else {
      document.getElementById('onboarding-modal').style.display = 'flex';
    }
  });
</script>

</body>
</html>
