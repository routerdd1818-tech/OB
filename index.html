<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OB報告：跨文化職場對話博弈（學員手機端）</title>
  <style>
    :root {
      /* Warm Beige Apple Minimalist Palette */
      --ios-bg: #f7f4ed;              /* Primary canvas: Warm soothing linen beige */
      --ios-surface: #ede8dc;         /* Secondary surface: Soft oat beige */
      --ios-card: #ffffff;            /* Card background: Pure warm crisp white */
      --ios-card-hover: #faf8f3;      /* Card hover: Soft ivory */
      --ios-elevated: #fcfbfa;        /* Floating card: Off-white */
      --ios-hairline: rgba(60, 50, 40, 0.1); /* Subtle warm hairline */
      --ios-hairline-strong: rgba(60, 50, 40, 0.18);
      --ios-shadow: 0 4px 18px rgba(70, 55, 40, 0.06);

      --ios-label: #1c1917;           /* Primary text: Deep warm charcoal */
      --ios-secondary-label: #57534e; /* Secondary text: Warm slate */
      --ios-tertiary-label: #8c827a;  /* Tertiary text: Muted warm gray */

      /* Refined Accents on Beige */
      --ios-blue: #0071e3;            /* Apple System Blue */
      --ios-green: #15803d;           /* Forest Green */
      --ios-amber: #b45309;           /* Warm Amber / Ochre */
      --ios-red: #dc2626;             /* Crimson Red */
      --ios-indigo: #4f46e5;          /* Deep Indigo */
      --ios-purple: #7c3aed;          /* Royal Violet */

      --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang TC", "Helvetica Neue", sans-serif;
      --ios-mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
      --ios-radius-card: 18px;
      --ios-radius-pill: 9999px;
      --ios-radius-btn: 14px;

      /* Legacy compatibility mappings */
      --bg-canvas: var(--ios-bg);
      --bg-surface: var(--ios-surface);
      --bg-card: var(--ios-card);
      --bg-card-hover: var(--ios-card-hover);
      --bg-elevated: var(--ios-elevated);
      --border-subtle: var(--ios-hairline);
      --border-medium: var(--ios-hairline-strong);
      --border-focus: var(--ios-blue);
      --text-primary: var(--ios-label);
      --text-secondary: var(--ios-secondary-label);
      --text-muted: var(--ios-tertiary-label);
      --accent-blue: var(--ios-blue);
      --color-success: var(--ios-green);
      --color-warning: var(--ios-amber);
      --color-danger: var(--ios-red);
      --font-sans: var(--ios-font);
      --font-mono: var(--ios-mono);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--ios-bg);
      color: var(--ios-label);
      font-family: var(--ios-font);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      -webkit-font-smoothing: antialiased;
    }

    #app-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--ios-bg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(70, 55, 40, 0.08);
      padding-bottom: 95px;
    }

    /* iOS Mobile Header */
    header.mobile-header {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(247, 244, 237, 0.9);
      border-bottom: 1px solid var(--ios-hairline);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mobile-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline);
      padding: 4px 12px;
      border-radius: var(--ios-radius-pill);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(70, 55, 40, 0.05);
    }
    .user-profile-badge:active { transform: scale(0.97); }
    .user-name-text { font-weight: 600; color: var(--ios-label); }
    .user-team-text { font-weight: 600; color: var(--ios-blue); font-family: var(--ios-mono); }
    .header-round-indicator { font-size: 11px; font-weight: 500; color: var(--ios-secondary-label); }

    /* Health Widget Card */
    .mobile-team-hp-card {
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--ios-shadow);
    }
    .mobile-team-hp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }
    .mobile-team-title { color: var(--ios-secondary-label); }
    .mobile-team-hp-num { color: var(--ios-green); font-family: var(--ios-mono); font-size: 13px; font-weight: 700; }
    .mobile-team-hp-track {
      width: 100%;
      height: 4px;
      background: rgba(60, 50, 40, 0.08);
      border-radius: var(--ios-radius-pill);
      overflow: hidden;
    }
    .mobile-team-hp-fill {
      height: 100%;
      width: 100%;
      background: var(--ios-green);
      border-radius: var(--ios-radius-pill);
      transition: width 0.6s ease, background 0.3s ease;
    }

    /* Mobile Arena */
    main.mobile-arena {
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
    }
    .scenario-brief-card {
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline);
      border-radius: var(--ios-radius-card);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--ios-shadow);
    }
    .scenario-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ios-blue);
      background: rgba(0, 113, 227, 0.1);
      padding: 3px 10px;
      border-radius: var(--ios-radius-pill);
      border: 1px solid rgba(0, 113, 227, 0.25);
      width: fit-content;
    }
    .scenario-title { font-size: 16px; font-weight: 700; color: var(--ios-label); letter-spacing: -0.01em; }
    .scenario-dialogue {
      background: var(--ios-bg);
      border: 1px solid var(--ios-hairline);
      border-left: 3px solid var(--ios-blue);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ios-label);
    }

    .mobile-vote-banner {
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline);
      border-left: 3px solid var(--ios-blue);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--ios-shadow);
    }
    .mobile-vote-banner-title { font-size: 13px; font-weight: 700; color: var(--ios-label); }
    .mobile-vote-banner-desc { font-size: 12px; color: var(--ios-secondary-label); line-height: 1.5; }

    /* iOS Mobile Tension Card */
    .ios-mobile-tension-card {
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline);
      border-radius: var(--ios-radius-card);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--ios-shadow);
    }
    .ios-tension-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ios-tension-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--ios-radius-pill);
      background: rgba(0, 113, 227, 0.1);
      color: var(--ios-blue);
      border: 1px solid rgba(0, 113, 227, 0.25);
    }
    .ios-tension-delta-badge {
      font-size: 12px;
      font-weight: 700;
      font-family: var(--ios-mono);
      padding: 3px 10px;
      border-radius: var(--ios-radius-pill);
      display: inline-flex;
      align-items: center;
    }
    .delta-high-drop {
      background: rgba(21, 128, 61, 0.12);
      color: #15803d;
      border: 1px solid rgba(21, 128, 61, 0.3);
    }
    .delta-no-drop {
      background: rgba(220, 38, 38, 0.12);
      color: #dc2626;
      border: 1px solid rgba(220, 38, 38, 0.3);
    }
    .ios-tension-gauge-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--ios-bg);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--ios-hairline);
    }
    .ios-tension-track {
      width: 100%;
      height: 6px;
      background: rgba(60, 50, 40, 0.08);
      border-radius: var(--ios-radius-pill);
      overflow: hidden;
    }
    .ios-tension-fill {
      height: 100%;
      border-radius: var(--ios-radius-pill);
      transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .ios-tension-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--ios-secondary-label);
    }
    .ios-tension-current-val {
      color: var(--ios-label);
      font-weight: 600;
      font-family: var(--ios-mono);
    }
    .ios-tension-comment {
      font-size: 12px;
      color: #44403c;
      line-height: 1.5;
    }

    /* Round 4 Special Mobile Components */
    .r4-mobile-intel-box {
      background: var(--ios-card);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--ios-shadow);
    }
    .r4-intel-heading { font-size: 13px; font-weight: 700; color: var(--ios-purple); }
    .r4-intel-item {
      font-size: 12px;
      color: #292524;
      line-height: 1.5;
      background: var(--ios-bg);
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--ios-purple);
    }
    .r4-mobile-wait {
      background: var(--ios-card);
      border: 1px dashed var(--ios-hairline);
      border-radius: 14px;
      padding: 16px;
      font-size: 13px;
      color: var(--ios-secondary-label);
      text-align: center;
      line-height: 1.55;
      box-shadow: var(--ios-shadow);
    }
    .r4-prop-review-card {
      background: var(--ios-card);
      border: 1px solid rgba(124, 58, 237, 0.35);
      border-radius: var(--ios-radius-card);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--ios-shadow);
    }
    .r4-prop-review-title { font-size: 14px; font-weight: 700; color: var(--ios-label); }
    .r4-prop-review-text {
      font-size: 13px;
      color: #292524;
      line-height: 1.6;
      background: var(--ios-bg);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--ios-hairline);
    }
    .r4-vote-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .r4-vote-btn {
      padding: 12px;
      border-radius: var(--ios-radius-pill);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      border: none;
    }
    .r4-vote-btn:active { transform: scale(0.97); }
    .r4-vote-btn.accept { background: rgba(21, 128, 61, 0.14); color: #15803d; border: 1px solid rgba(21, 128, 61, 0.35); }
    .r4-vote-btn.accept:hover, .r4-vote-btn.accept.selected { background: #15803d; color: #ffffff; }
    .r4-vote-btn.reject { background: rgba(220, 38, 38, 0.14); color: #dc2626; border: 1px solid rgba(220, 38, 38, 0.35); }
    .r4-vote-btn.reject:hover, .r4-vote-btn.reject.selected { background: #dc2626; color: #ffffff; }
    .r4-constraint-box {
      background: rgba(180, 83, 9, 0.1);
      border: 1px solid rgba(180, 83, 9, 0.25);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      color: #b45309;
      line-height: 1.5;
    }

    /* Options List */
    .mobile-options-container { display: flex; flex-direction: column; gap: 10px; }
    .mobile-option-card {
      background: var(--ios-card);
      border: 1px solid var(--ios-hairline);
      border-radius: var(--ios-radius-card);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--ios-shadow);
    }
    .mobile-option-card:active { transform: scale(0.98); }
    .mobile-option-card.selected {
      border-color: var(--ios-blue);
      background: rgba(0, 113, 227, 0.05);
      box-shadow: 0 0 16px rgba(0, 113, 227, 0.15);
    }
    .mobile-option-card.my-team-chosen {
      border-color: var(--ios-blue);
      background: rgba(0, 113, 227, 0.08);
    }
    .mobile-option-title { font-size: 13.5px; font-weight: 700; color: var(--ios-label); }
    .mobile-option-text { font-size: 12.5px; line-height: 1.55; color: #44403c; }
    .mobile-reveal-box {
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.55;
      display: none;
    }
    .mobile-reveal-box.reveal-penalty { background: rgba(220, 38, 38, 0.08); border: 1px solid rgba(220, 38, 38, 0.25); color: #991b1b; }
    .mobile-reveal-box.reveal-success { background: rgba(21, 128, 61, 0.08); border: 1px solid rgba(21, 128, 61, 0.25); color: #166534; }

    /* iOS Sticky Bottom Submit Bar */
    .mobile-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      z-index: 100;
      background: rgba(247, 244, 237, 0.94);
      border-top: 1px solid var(--ios-hairline);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 20px rgba(70, 55, 40, 0.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
    }
    .mobile-bottom-info { display: flex; flex-direction: column; gap: 2px; max-width: 60%; }
    .mobile-selection-label { font-size: 10px; color: var(--ios-tertiary-label); }
    .mobile-selection-val { font-size: 12.5px; font-weight: 600; color: var(--ios-label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mobile-submit-btn {
      background: var(--ios-blue);
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: var(--ios-radius-pill);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.25);
    }
    .mobile-submit-btn:active { transform: scale(0.97); }
    .mobile-submit-btn:disabled {
      background: rgba(60, 50, 40, 0.12);
      color: var(--ios-tertiary-label);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Onboarding Modal */
    .onboarding-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(40, 35, 30, 0.45);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      backdrop-filter: blur(15px);
    }
    .onboarding-card {
      background: #ffffff;
      border: 1px solid var(--ios-hairline-strong);
      border-radius: 24px;
      max-width: 380px;
      width: 100%;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 12px 40px rgba(70, 55, 40, 0.18);
    }
    .onboarding-title { font-size: 17px; font-weight: 700; color: var(--ios-label); text-align: center; }
    .onboarding-desc { font-size: 12.5px; color: var(--ios-secondary-label); line-height: 1.5; text-align: center; }
    .onboarding-form { display: flex; flex-direction: column; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--ios-secondary-label); }
    .form-input {
      background: var(--ios-bg);
      border: 1px solid var(--ios-hairline);
      color: var(--ios-label);
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus { border-color: var(--ios-blue); }

    .team-pills-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .team-pill-btn {
      background: var(--ios-bg);
      border: 1px solid var(--ios-hairline);
      color: var(--ios-secondary-label);
      font-size: 12px;
      font-weight: 600;
      padding: 10px 4px;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .team-pill-btn:active { transform: scale(0.96); }
    .team-pill-btn.active {
      background: var(--ios-blue);
      border-color: var(--ios-blue);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.25);
    }

    .onboarding-btn {
      background: var(--ios-blue);
      color: #ffffff;
      border: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      border-radius: var(--ios-radius-pill);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.25);
    }
    .onboarding-btn:active { transform: scale(0.97); }

    .footer-host-link {
      font-size: 11px;
      color: var(--ios-tertiary-label);
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      padding: 8px;
    }
  </style>
</head>
<body>

<div id="app-container">
  <header class="mobile-header">
    <div class="mobile-header-top">
      <div class="user-profile-badge" onclick="reopenOnboarding()">
        <span class="user-name-text" id="hud-user-name">學員</span>
        <span>|</span>
        <span class="user-team-text" id="hud-user-team">第 1 組</span>
      </div>
      <span style="font-size: 10px; color: #a39789;" id="round-status-indicator">【等待大螢幕指示】</span>
    </div>

    <div class="mobile-team-hp-card">
      <div class="mobile-team-hp-header">
        <span class="mobile-team-title" id="team-hp-title">本組 CQ 生命值</span>
        <span class="mobile-team-hp-num" id="team-hp-num">100 CQ</span>
      </div>
      <div class="mobile-team-hp-track">
        <div class="mobile-team-hp-fill" id="team-hp-fill"></div>
      </div>
    </div>
  </header>

  <main class="mobile-arena">
    <div class="scenario-brief-card">
      <div class="scenario-badge" id="mobile-theme-tag">【認知維度】</div>
      <h2 class="scenario-title" id="mobile-scenario-title">委婉留白時的追問藝術</h2>
      <div class="scenario-dialogue" id="mobile-dialogue-text">載入中...</div>
    </div>

    <div id="mobile-tension-wrap" style="display: none; margin-bottom: 12px;"></div>
    <div class="mobile-options-container" id="mobile-options-list"></div>

    <div class="footer-host-link" onclick="window.location.href='/host'">
      [ 簡報者切換至電腦主控台 ]
    </div>
  </main>

  <div class="mobile-bottom-bar">
    <div class="mobile-bottom-info">
      <span class="mobile-selection-label">本組研議之代表決策：</span>
      <span class="mobile-selection-val" id="bottom-selected-text">尚未選取選項</span>
    </div>
    <button class="mobile-submit-btn" id="btn-bottom-submit" onclick="submitDecision()" disabled>
      送出本組決策
    </button>
  </div>
</div>

<!-- Onboarding Modal (Requires Name + Team, NO expected team size displayed!) -->
<div class="onboarding-overlay" id="onboarding-modal" style="display: none;">
  <div class="onboarding-card">
    <h3 class="onboarding-title">OB報告</h3>
    <p class="onboarding-desc">請輸入您的姓名並點選所屬組別以加入決策會議：</p>
    <div class="onboarding-form">
      <div class="form-group">
        <label class="form-label">您的姓名：</label>
        <input type="text" class="form-input" id="input-name" placeholder="請輸入姓名（例如：王專員）" />
      </div>
      <div class="form-group">
        <label class="form-label">所屬組別：</label>
        <div class="team-pills-grid" id="team-selector-pills">
          <button type="button" class="team-pill-btn active" id="pill-team-1" onclick="selectTeamPill(1)">第 1 組</button>
          <button type="button" class="team-pill-btn" id="pill-team-2" onclick="selectTeamPill(2)">第 2 組</button>
          <button type="button" class="team-pill-btn" id="pill-team-3" onclick="selectTeamPill(3)">第 3 組</button>
          <button type="button" class="team-pill-btn" id="pill-team-4" onclick="selectTeamPill(4)">第 4 組</button>
          <button type="button" class="team-pill-btn" id="pill-team-5" onclick="selectTeamPill(5)">第 5 組</button>
        </div>
        <input type="hidden" id="input-team" value="1" />
      </div>
      <button class="onboarding-btn" onclick="confirmOnboarding()">進入會議</button>
    </div>
  </div>
</div>

<script>

  const AudioEngine = {
    ctx: null,
    init() {
      if (!this.ctx) {

  function initMobileApp() {
    try {
      MobileState.syncChannel = new BroadcastChannel('project_atlas_cq_sync');
      MobileState.syncChannel.onmessage = (e) => {
        handleHostSync(e.data);
      };
    } catch (err) {}

    window.addEventListener('storage', (e) => {
      if (e.key === 'project_atlas_cq_state' && e.newValue) {
        try { handleHostSync(JSON.parse(e.newValue)); } catch (err) {}
      }
    });

    // Check saved user
    const saved = localStorage.getItem('atlas_mobile_user');
    if (saved) {
      try {
        MobileState.user = JSON.parse(saved);
        updateUserUI();
      } catch (e) {
        showOnboarding();
      }
    } else {
      showOnboarding();
    }

    renderCurrentRound();
  }

  function showOnboarding() {
    const modal = document.getElementById('onboarding-modal');
    if (modal) modal.style.display = 'flex';
    selectTeamPill(MobileState.user.team || 1);
  }

  function selectTeamPill(teamId) {
    AudioEngine.playClick();
    document.getElementById('input-team').value = teamId;
    for (let i = 1; i <= 5; i++) {
      const p = document.getElementById(`pill-team-${i}`);
      if (p) {
        if (i === teamId) p.classList.add('active');
        else p.classList.remove('active');
      }
    }
  }

  function reopenOnboarding() {
    AudioEngine.playClick();
    document.getElementById('input-name').value = MobileState.user.name || '';
    const teamId = MobileState.user.team || 1;
    document.getElementById('input-team').value = teamId;
    selectTeamPill(teamId);
    showOnboarding();
  }

  function confirmOnboarding() {
    AudioEngine.playClick();
    const name = document.getElementById('input-name').value.trim();
    const team = parseInt(document.getElementById('input-team').value, 10);
    if (!name) {
      alert('請先輸入您的姓名！');
      return;
    }
    MobileState.user = { name, team };
    localStorage.setItem('atlas_mobile_user', JSON.stringify(MobileState.user));
    document.getElementById('onboarding-modal').style.display = 'none';
    updateUserUI();

    // Broadcast join event
    broadcastToHost('TEAM_JOIN', { teamId: team, userName: name });
    renderCurrentRound();
  }

  function updateUserUI() {
    document.getElementById('hud-user-name').innerText = MobileState.user.name || '學員';
    document.getElementById('hud-user-team').innerText = `第 ${MobileState.user.team} 組`;
    updateTeamHPUI();
  }

  function updateTeamHPUI() {
    const team = MobileState.teams[MobileState.user.team];
    if (!team) return;
    document.getElementById('team-hp-title').innerText = `${team.name.split('（')[0]} 生命值`;
    document.getElementById('team-hp-num').innerText = `${team.hp} CQ`;
    const fill = document.getElementById('team-hp-fill');
    if (fill) fill.style.width = `${Math.max(0, Math.min(100, team.hp))}%`;
  }

  function handleHostSync(msg) {
    if (!msg || !msg.type) return;
    if (msg.type === 'STATE_UPDATE') {
      if (msg.teams) MobileState.teams = msg.teams;
      if (msg.currentRound) MobileState.currentRound = msg.currentRound;
      if (msg.roundStatus) MobileState.roundStatus = msg.roundStatus;
      if (msg.r4Proposal) MobileState.r4Proposal = msg.r4Proposal;
      updateTeamHPUI();
      renderCurrentRound();
      if (msg.tensionData) MobileState.tensionData = msg.tensionData;
      if (MobileState.roundStatus === 'revealed') {
        applyMobileRevealedUI(msg.tensionData || MobileState.tensionData);
      }
    } else if (msg.type === 'R4_PROPOSAL_OFFER') {
      MobileState.r4Proposal = msg.proposalId;
      AudioEngine.playChime();
      renderCurrentRound();
    } else if (msg.type === 'TEAM_SUBMIT') {
      const { teamId, choiceId } = msg;
      // Isolated voting: strictly ignore other teams' choices
      if (teamId === MobileState.user.team && MobileState.teams[teamId]) {
        MobileState.teams[teamId].currentChoice = choiceId;
        MobileState.teams[teamId].submitted = true;
        updateSubmissionUI();
      }
    }
  }

  function broadcastToHost(type, payload = {}) {
    const packet = { type, ...payload, timestamp: Date.now() };
    if (MobileState.syncChannel) {
      try { MobileState.syncChannel.postMessage(packet); } catch (e) {}
    }
    try { localStorage.setItem('project_atlas_cq_state', JSON.stringify(packet)); } catch (e) {}
  }

  function renderCurrentRound() {
    const roundNum = MobileState.currentRound;
    const data = DilemmasData[roundNum];
    if (!data) return;

    if (roundNum === 4) {
      renderRound4Mobile(data);
      return;
    }

    // Regular Rounds 1-3
    document.getElementById('mobile-theme-tag').innerText = data.themeTag;
    document.getElementById('mobile-scenario-title').innerText = data.title;
    document.getElementById('mobile-dialogue-text').innerText = data.dialogue;

    renderOptions(data.options);
    updateSubmissionUI();
    updateTeamHPUI();
  }

  function renderOptions(options) {
    const list = document.getElementById('mobile-options-list');
    const tensionWrap = document.getElementById('mobile-tension-wrap');
    if (tensionWrap && MobileState.roundStatus === 'voting') tensionWrap.style.display = 'none';
    if (!list) return;
    let html = '';
    const myTeam = MobileState.teams[MobileState.user.team];

    options.forEach(opt => {
      const isSelected = (myTeam.currentChoice === opt.id);
      html += `
        <div class="mobile-option-card ${isSelected ? 'selected' : ''}" id="m-opt-${opt.id}" onclick="selectMobileOption('${opt.id}')">
          <div class="mobile-option-title">${opt.title}</div>
          <div class="mobile-option-text">${opt.text}</div>
          <!-- Strictly NO hints before or during voting -->
          <div class="mobile-reveal-box ${opt.penalty < 0 ? 'reveal-penalty' : 'reveal-success'}" id="m-reveal-${opt.id}">
            <strong>【CQ 判定結果】：${opt.penalty < 0 ? `${opt.penalty} 點 CQ` : `+${opt.bonus} 點 CQ (卓越決策)`}</strong><br>
            <span>${opt.blindspot}</span>
          </div>
        </div>
      `;
    });
    list.innerHTML = html;
  }

  function renderRound4Mobile(data) {
    const userTeam = MobileState.user.team;
    const themeTagEl = document.getElementById('mobile-theme-tag');
    const titleEl = document.getElementById('mobile-scenario-title');
    const dialEl = document.getElementById('mobile-dialogue-text');
    const list = document.getElementById('mobile-options-list');
    const tensionWrap = document.getElementById('mobile-tension-wrap');
    if (tensionWrap && MobileState.roundStatus === 'voting') tensionWrap.style.display = 'none';
    const bottomBar = document.querySelector('.mobile-bottom-bar');
    if (!list) return;

    themeTagEl.innerText = data.themeTag;

    if (userTeam === 1 || userTeam === 2) {
      // HQ Perspective (Secret)
      titleEl.innerText = data.hqContext.title;
      dialEl.innerHTML = `${data.hqContext.briefing}<br><br><div class="r4-constraint-box"><strong>${data.hqContext.coreConstraint}</strong></div>`;
      if (bottomBar) bottomBar.style.display = 'none';

      // Proposal review area
      const propId = MobileState.r4Proposal;
      const proposal = propId ? data.proposals.find(p => p.id === propId) : null;

      if (!proposal) {
        list.innerHTML = `
          <div class="r4-mobile-wait">
            變色龍正在審閱全域情資並研擬調解協定中...<br>
            <strong>【請先與公司代表進行 1 分鐘口頭辯論】</strong><br>
            前半段為總部發言時間，請陳述市場做空壓力與不可退讓底線。
          </div>
        `;
      } else {
        const myDec = MobileState.r4Decision;
        list.innerHTML = `
          <div class="r4-prop-review-card">
            <div class="r4-prop-review-title">【收到變色龍最新調解方案：${proposal.title}】</div>
            <div class="r4-prop-review-text">${proposal.text}</div>
            <div style="font-size: 12px; color: var(--text-secondary);">請總部內部審議後表態：</div>
            <div class="r4-vote-btn-group">
              <button class="r4-vote-btn accept ${myDec === 'accept' ? 'selected' : ''}" onclick="submitR4Decision('accept')">可接受此提案</button>
              <button class="r4-vote-btn reject ${myDec === 'reject' ? 'selected' : ''}" onclick="submitR4Decision('reject')">不接受此提案</button>
            </div>
            ${myDec ? `<div style="font-size: 11.5px; color: #38bdf8; text-align: center; margin-top: 4px;">貴組已表態：【${myDec === 'accept' ? '可接受' : '不接受'}】。等待開票！</div>` : ''}
          </div>
        `;
      }
    } else if (userTeam === 3 || userTeam === 4) {
      // Company Perspective (Secret)
      titleEl.innerText = data.tokyoContext.title;
      dialEl.innerHTML = `${data.tokyoContext.briefing}<br><br><div class="r4-constraint-box"><strong>${data.tokyoContext.coreConstraint}</strong></div>`;
      if (bottomBar) bottomBar.style.display = 'none';

      const propId = MobileState.r4Proposal;
      const proposal = propId ? data.proposals.find(p => p.id === propId) : null;

      if (!proposal) {
        list.innerHTML = `
          <div class="r4-mobile-wait">
            變色龍正在審閱全域情資並研擬調解協定中...<br>
            <strong>【請先與總部代表進行 1 分鐘口頭辯論】</strong><br>
            後半段為公司發言時間，請陳述現場良率實情與責任底線。
          </div>
        `;
      } else {
        const myDec = MobileState.r4Decision;
        list.innerHTML = `
          <div class="r4-prop-review-card">
            <div class="r4-prop-review-title">【收到變色龍最新調解方案：${proposal.title}】</div>
            <div class="r4-prop-review-text">${proposal.text}</div>
            <div style="font-size: 12px; color: var(--text-secondary);">請公司現場內部審議後表態：</div>
            <div class="r4-vote-btn-group">
              <button class="r4-vote-btn accept ${myDec === 'accept' ? 'selected' : ''}" onclick="submitR4Decision('accept')">可接受此提案</button>
              <button class="r4-vote-btn reject ${myDec === 'reject' ? 'selected' : ''}" onclick="submitR4Decision('reject')">不接受此提案</button>
            </div>
            ${myDec ? `<div style="font-size: 11.5px; color: #34d399; text-align: center; margin-top: 4px;">貴組已表態：【${myDec === 'accept' ? '可接受' : '不接受'}】。等待開票！</div>` : ''}
          </div>
        `;
      }
    } else if (userTeam === 5) {
      // Chameleon Perspective (All-seeing Intel)
      titleEl.innerText = data.chameleonContext.title;
      dialEl.innerHTML = `
        <div class="r4-mobile-intel-box">
          <div class="r4-intel-heading">【獨家全域情報（僅變色龍掌握）】</div>
          <div class="r4-intel-item">${data.chameleonContext.intelDossier[0]}</div>
          <div class="r4-intel-item">${data.chameleonContext.intelDossier[1]}</div>
        </div>
        <p style="margin-top: 8px; font-size: 12px; color: var(--text-secondary);">${data.chameleonContext.mission}</p>
      `;

      if (bottomBar) bottomBar.style.display = 'flex';
      const myChoice = MobileState.teams[5].currentChoice;

      let html = '';
      data.proposals.forEach(prop => {
        const isSel = (myChoice === prop.id);
        html += `
          <div class="mobile-option-card ${isSel ? 'selected' : ''}" onclick="selectChameleonProposal('${prop.id}')">
            <div class="mobile-option-title">${prop.title}</div>
            <div class="mobile-option-text">${prop.text}</div>
          </div>
        `;
      });
      list.innerHTML = html;

      const submitBtn = document.getElementById('btn-bottom-submit');
      const textLabel = document.getElementById('bottom-selected-text');
      if (myChoice) {
        textLabel.innerText = `選定方案：${myChoice}（隨時可調整重送）`;
        submitBtn.innerText = '送出調解提案給雙方';
        submitBtn.disabled = false;
      } else {
        textLabel.innerText = '請選定調解方案';
        submitBtn.innerText = '送出調解提案給雙方';
        submitBtn.disabled = true;
      }
    }
  }

  function selectChameleonProposal(propId) {
    AudioEngine.playClick();
    MobileState.teams[5].currentChoice = propId;
    renderCurrentRound();
  }

  function submitR4Decision(decision) {
    AudioEngine.playClick();
    MobileState.r4Decision = decision;
    MobileState.teams[MobileState.user.team].currentChoice = decision;
    MobileState.teams[MobileState.user.team].submitted = true;
    renderCurrentRound();

    broadcastToHost('R4_DECISION', {
      teamId: MobileState.user.team,
      decision: decision
    });
  }


  function selectMobileOption(choiceId) {
    AudioEngine.playClick();
    if (MobileState.roundStatus === 'revealed') return;
    const myTeam = MobileState.teams[MobileState.user.team];
    if (myTeam.submitted) return;

    myTeam.currentChoice = choiceId;
    document.querySelectorAll('.mobile-option-card').forEach(c => c.classList.remove('selected'));
    const target = document.getElementById(`m-opt-${choiceId}`);
    if (target) target.classList.add('selected');

    updateSubmissionUI();
  }

  function updateSubmissionUI() {
    const myTeam = MobileState.teams[MobileState.user.team];
    const textLabel = document.getElementById('bottom-selected-text');
    const submitBtn = document.getElementById('btn-bottom-submit');
    const statusIndicator = document.getElementById('round-status-indicator');

    const bannerTitle = document.getElementById('mobile-banner-title');
    const bannerDesc = document.getElementById('mobile-banner-desc');

    if (myTeam.submitted) {
      textLabel.innerText = `本組已送出：選項 ${myTeam.currentChoice}`;
      submitBtn.innerText = '已送出代表決策';
      submitBtn.disabled = true;
      statusIndicator.innerText = '已送出 · 請看大螢幕';
      if (bannerTitle) bannerTitle.innerText = `貴組已送出代表決策：選項 ${myTeam.currentChoice}`;
      if (bannerDesc) bannerDesc.innerText = '每組投票獨立保密不互通。請抬頭看前方大螢幕，等待報告者揭曉全班投票結果。';
    } else if (myTeam.currentChoice) {
      textLabel.innerText = `已選取：選項 ${myTeam.currentChoice}`;
      submitBtn.innerText = '送出本組決策';
      submitBtn.disabled = false;
      statusIndicator.innerText = '請確認並送出';
      if (bannerTitle) bannerTitle.innerText = '組內決策研討中';
      if (bannerDesc) bannerDesc.innerText = '每組投票獨立保密不互通，請組內取得共識後選取並送出。';
    } else {
      textLabel.innerText = '尚未選取選項';
      submitBtn.innerText = '送出本組決策';
      submitBtn.disabled = true;
      statusIndicator.innerText = '決策研討中';
      if (bannerTitle) bannerTitle.innerText = '組內決策研討中';
      if (bannerDesc) bannerDesc.innerText = '每組投票獨立保密不互通，請組內取得共識後選取並送出。';
    }
  }

  function submitDecision() {
    AudioEngine.playChime();
    const myTeam = MobileState.teams[MobileState.user.team];
    if (!myTeam.currentChoice) return;

    if (MobileState.currentRound === 4 && MobileState.user.team === 5) {
      MobileState.r4Proposal = myTeam.currentChoice;
      myTeam.submitted = true;
      broadcastToHost('CHAMELEON_PROPOSAL', {
        proposalId: myTeam.currentChoice
      });
      alert('已將【方案 ' + myTeam.currentChoice + '】送達總部與公司端！雙方正在手機審議中。');
      renderCurrentRound();
      return;
    }

    myTeam.submitted = true;
    updateSubmissionUI();

    broadcastToHost('TEAM_SUBMIT', {
      teamId: MobileState.user.team,
      choiceId: myTeam.currentChoice
    });
  }

  function applyMobileRevealedUI(tensionData) {
    const currentData = DilemmasData[MobileState.currentRound];
    if (!currentData) return;
    const myTeam = MobileState.teams[MobileState.user.team];
    const bannerTitle = document.getElementById('mobile-banner-title');
    const bannerDesc = document.getElementById('mobile-banner-desc');

    if (bannerTitle) bannerTitle.innerText = `【開票完成】貴組選擇：選項 ${myTeam.currentChoice || '未作答'}`;
    if (bannerDesc) bannerDesc.innerText = '全班各組投票統計分佈僅於前方大螢幕報告者主控台顯示。貴組之 CQ 判定、對話張力變化與決策覆盤如下：';

    // Render iOS Mobile Tension Card
    const tensionWrap = document.getElementById('mobile-tension-wrap');
    if (tensionWrap) {
      tensionWrap.style.display = 'block';

      if (MobileState.currentRound === 4) {
        const isAgreement = tensionData ? tensionData.isAgreement : true;
        const prop = currentData.proposals.find(p => p.id === MobileState.r4Proposal) || currentData.proposals[3];
        const initialTension = currentData.initialTension || "98%";
        const tensionDrop = isAgreement ? prop.tensionDrop : "0%";
        const tensionRemaining = isAgreement ? prop.tensionRemaining : "100%";
        const tensionComment = isAgreement ? prop.tensionComment : "談判破局！華爾街做空狙擊，東京集體辭職，對話張力飆升至 100% 毀滅性爆點！";
        const isDrop = isAgreement && (prop.tensionDrop !== "0%");

        tensionWrap.innerHTML = `
          <div class="ios-mobile-tension-card">
            <div class="ios-tension-top">
              <span class="ios-tension-pill">對話張力即時公布</span>
              <span class="ios-tension-delta-badge ${isDrop ? 'delta-high-drop' : 'delta-no-drop'}">
                ${isDrop ? `張力降低 ${tensionDrop}` : `張力未降低（極限緊繃）`}
              </span>
            </div>
            <div class="ios-tension-gauge-wrap">
              <div class="ios-tension-track">
                <div class="ios-tension-fill" style="width: ${parseInt(tensionRemaining)}%; background: ${isDrop ? 'var(--ios-green)' : 'var(--ios-red)'};"></div>
              </div>
              <div class="ios-tension-labels">
                <span>起始張力：${initialTension}</span>
                <span class="ios-tension-current-val">目前張力：${tensionRemaining}</span>
              </div>
            </div>
            <div class="ios-tension-comment"><strong>【調解張力解析】：</strong>${tensionComment}</div>
          </div>
        `;
      } else {
        let opt = currentData.options.find(o => o.id === myTeam.currentChoice);
        if (!opt) opt = currentData.options[0];
        const initialTension = currentData.initialTension || "85%";
        const isDrop = (opt.tensionDrop !== "0%");

        tensionWrap.innerHTML = `
          <div class="ios-mobile-tension-card">
            <div class="ios-tension-top">
              <span class="ios-tension-pill">對話張力即時公布</span>
              <span class="ios-tension-delta-badge ${isDrop ? 'delta-high-drop' : 'delta-no-drop'}">
                ${isDrop ? `貴組使張力降低 ${opt.tensionDrop}` : `張力未降低（加劇緊繃）`}
              </span>
            </div>
            <div class="ios-tension-gauge-wrap">
              <div class="ios-tension-track">
                <div class="ios-tension-fill" style="width: ${parseInt(opt.tensionRemaining)}%; background: ${isDrop ? 'var(--ios-green)' : 'var(--ios-red)'};"></div>
              </div>
              <div class="ios-tension-labels">
                <span>起始張力：${initialTension}</span>
                <span class="ios-tension-current-val">目前張力：${opt.tensionRemaining}</span>
              </div>
            </div>
            <div class="ios-tension-comment"><strong>【貴組決策張力解析】：</strong>${opt.tensionComment}</div>
          </div>
        `;
      }
    }

    let opts = currentData.options;
    if (opts) {
      opts.forEach(opt => {
        const box = document.getElementById(`m-reveal-${opt.id}`);
        const card = document.getElementById(`m-opt-${opt.id}`);
        if (box) {
          box.style.display = 'block';
        }
        if (card && opt.id === myTeam.currentChoice) {
          card.classList.add('my-team-chosen');
        }
      });
    }
    document.getElementById('round-status-indicator').innerText = '開票完成 · 請看大螢幕';
  }

  window.addEventListener('DOMContentLoaded', () => {
    initMobileApp();
  });
</script>

</body>
</html>
